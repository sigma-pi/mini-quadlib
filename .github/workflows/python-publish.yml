name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # manylinux container uses yum
          yum install -y cmake make gcc gcc-c++
          
          # Use Python 3.11 from manylinux
          export PATH="/opt/python/cp311-cp311/bin:$PATH"
          python -m pip install --upgrade pip build

      - name: Build C library
        run: |
          mkdir -p build
          cd build
          cmake .. -DBUILD_PYTHON=ON
          make -j$(nproc)
          ls -la libmini_quadlib.so
          
          # Verify GLIBC version requirement
          objdump -T libmini_quadlib.so | grep GLIBC | head -5

      - name: Copy .so to package
        run: |
          cp build/libmini_quadlib.so python/mini_quadlib/
          ls -la python/mini_quadlib/

      - name: Build wheel
        run: |
          export PATH="/opt/python/cp311-cp311/bin:$PATH"
          cd python
          python -m build
          
          # Verify .so is in wheel
          unzip -l dist/*.whl | grep .so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/mini-quadlib

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1