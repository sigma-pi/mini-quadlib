[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-quadlib"
version = "0.1.2"
description = "Python bindings for mini-quadlib: A lightweight C library for quadrotor control"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Chengyu Yang", email = "chengyuy520@gmail.com"},
]
keywords = [
  "robotics",
  "quadrotor", 
  "drone",
  "control",
  "aerospace",
  "geometric-control",
  "L1-adaptive",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=6.0",
  "pytest-cov",
  "black",
  "flake8",
]

[project.urls]
Homepage = "https://github.com/sigma-pi/mini-quadlib"
Repository = "https://github.com/sigma-pi/mini-quadlib"
Documentation = "https://github.com/sigma-pi/mini-quadlib#readme"
Issues = "https://github.com/sigma-pi/mini-quadlib/issues"

# =============================================================================
# Setuptools Configuration
# =============================================================================

[tool.setuptools]
packages = ["mini_quadlib"]

[tool.setuptools.package-data]
mini_quadlib = [
  "*.so",
  "libmini_quadlib.so",
  "py.typed",
]

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]